[project]
name = "ballast"
version = "0.1.0"
description = "Foundation domain layer for the ballast leveraged-ETF bot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ccy5123" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The backtest layer (src/ballast/backtest) MAY use pandas/numpy; the pure core
# (src/ballast/core) MUST NOT. Kept as an extra so the core stays lightweight.
backtest = [
    "pandas>=2",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pandas>=2",
    "pandas-stubs",
    "numpy>=1.26",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballast"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# `.claude/` holds vendored MoAI tooling (hooks/skills) outside the ballast
# package; it is not part of this project's source and is excluded from gates.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ballast"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = false

# Scoped escape hatch for the backtest layer's third-party numerics ONLY.
# pandas-stubs is installed for typing, but numpy's runtime types and a few
# pandas surfaces can trip --strict; this NEVER relaxes strict on ballast.* code.
[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ballast --cov-report=term-missing --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ballast"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
